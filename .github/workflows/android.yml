name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: wrapper

    # --- ВАЖНО: Гарантируем права на выполнение для gradlew ---
    - name: Make gradlew executable
      run: chmod +x gradlew
    # -----------------------------------------------------------

    - name: Build Release APK
      run: ./gradlew assembleRelease --no-daemon

    - name: List generated APKs and sizes
      run: |
        echo "📦 Сгенерированные APK:"
        ls -lh app/build/outputs/apk/release/*.apk || echo "APK не найдены"

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: buckwheat-release-arm64-v8a
        # Путь ищет файл с именем, содержащим "arm64-v8a", как мы задали в build.gradle.kts
        path: app/build/outputs/apk/release/*arm64-v8a.apk
        retention-days: 2
        if-no-files-found: error

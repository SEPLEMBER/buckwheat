name: Android CI (Simple Test)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # Настраиваем базовый Gradle для команды генерации wrapper-а
    - name: Setup Base Gradle
      uses: gradle/actions/setup-gradle@v4

    # --- ИСПРАВЛЕННЫЙ ШАГ: Генерируем wrapper строго с совместимой версией Gradle 8.10.2 ---
    - name: Ensure Gradle Wrapper exists and is executable
      run: |
        if [ ! -f ./gradlew ]; then
          echo "⚠️ gradlew not found. Generating it with Gradle 8.10.2 (compatible with AGP 8.x)..."
          gradle wrapper --gradle-version 8.10.2
        else
          echo "✅ gradlew found."
        fi
        chmod +x ./gradlew
    # ---------------------------------------------------------------------------------------

    - name: Build Release APK
      run: ./gradlew assembleRelease --no-daemon

    - name: List generated APKs
      run: |
        echo "📦 Сгенерированные APK:"
        ls -lh app/build/outputs/apk/release/*.apk || echo "⚠️ APK не найдены в ожидаемой папке"

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: buckwheat-release-apk
        path: app/build/outputs/apk/release/*.apk
        retention-days: 7
        if-no-files-found: warn

name: Android CI (Simple Test)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Скачиваем код репозитория
    - name: Check out repository
      uses: actions/checkout@v4

    # 2. Настраиваем Java 17 (требуется вашим build.gradle.kts)
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # 3. Настраиваем Gradle с кэшированием для ускорения
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    # 4. УМНЫЙ ШАГ: Если gradlew забыли закоммитить, мы его создадим
    - name: Ensure Gradle Wrapper exists and is executable
      run: |
        if [ ! -f ./gradlew ]; then
          echo "⚠️ gradlew not found in repository! Generating it automatically..."
          gradle wrapper
        else
          echo "✅ gradlew found."
        fi
        chmod +x ./gradlew

    # 5. Запускаем сборку Release APK
    - name: Build Release APK
      run: ./gradlew assembleRelease --no-daemon

    # 6. Выводим список созданных файлов (поможет понять, если что-то пошло не так)
    - name: List generated APKs
      run: |
        echo "📦 Сгенерированные APK:"
        ls -lh app/build/outputs/apk/release/*.apk || echo "⚠️ APK не найдены в ожидаемой папке"

    # 7. Сохраняем APK как артефакт, чтобы его можно было скачать с GitHub
    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: buckwheat-release-apk
        path: app/build/outputs/apk/release/*.apk
        retention-days: 2
        if-no-files-found: warn # 'warn' вместо 'error', чтобы сборка не падала красным, если APK вдруг не создался
